<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#0b0f19">
  <meta name="color-scheme" content="dark light">

  <meta
    name="description"
    content="ingr.in portfolio — projects, skills, experience and contact information.">

  <meta
    name="keywords"
    content="ingr.in, portfolio, web developer, projects, HTML, CSS, JavaScript, PHP">

  <meta name="author" content="ingr.in">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="canonical" href="https://portfolio.ingr.in/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Portfolio | ingr.in">
  <meta
    property="og:description"
    content="Explore projects, skills and work from ingr.in.">
  <meta property="og:url" content="https://portfolio.ingr.in/">
  <meta property="og:site_name" content="ingr.in Portfolio">
  <meta property="og:locale" content="en_IN">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Portfolio | ingr.in">
  <meta
    name="twitter:description"
    content="Explore projects, skills and work from ingr.in.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon.svg">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portfolio">

  <title>Portfolio | ingr.in</title>

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <a class="skip-link" href="#app">
    Skip to content
  </a>

  <div class="app-shell">

    <header class="app-header">

      <a
        class="brand"
        href="#home"
        aria-label="Portfolio home">

        <span class="brand-mark" aria-hidden="true">
          i
        </span>

        <span>ingr.in</span>

      </a>

      <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Toggle navigation"
        aria-expanded="false"
        aria-controls="mobileMenu">

        <span></span>
        <span></span>
        <span></span>

      </button>

      <nav
        class="desktop-nav"
        aria-label="Primary navigation">

        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>

      </nav>

    </header>


    <nav
      class="mobile-menu"
      id="mobileMenu"
      aria-label="Mobile navigation">

      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>

    </nav>


    <main
      id="app"
      tabindex="-1"
      aria-live="polite">

      <section class="loading-card">

        <div class="loader"></div>

        <p>Loading portfolio…</p>

      </section>

    </main>


    <footer class="app-footer">

      <p>
        © <span id="year"></span> ingr.in
      </p>

    </footer>


    <nav
      class="bottom-nav"
      aria-label="Quick navigation">

      <a href="#home" data-nav="home">
        <span>⌂</span>
        <small>Home</small>
      </a>

      <a href="#projects" data-nav="projects">
        <span>▦</span>
        <small>Projects</small>
      </a>

      <a href="#skills" data-nav="skills">
        <span>✦</span>
        <small>Skills</small>
      </a>

      <a href="#contact" data-nav="contact">
        <span>✉</span>
        <small>Contact</small>
      </a>

    </nav>

  </div>


  <noscript>

    <div class="noscript-message">
      JavaScript is required for this portfolio.
    </div>

  </noscript>


  <script src="assets/js/script.js" defer></script>

</body>
</html>
